name: Build and Publish

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            dist: win
          - os: ubuntu-latest
            name: Linux
            dist: linux
          - os: macos-latest
            name: macOS
            dist: mac
    runs-on: ${{ matrix.os }}

    name: Build ${{ matrix.name }} Distribution
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build dist with electron-builder
        run: pnpm dist:${{ matrix.dist }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: BashPrime Hint Tracker-${{ matrix.dist }}
          if-no-files-found: error
          path: |
            dist/BashPrime Hint Tracker*.msi
            dist/BashPrime Hint Tracker*.exe
            dist/BashPrime Hint Tracker*.dmg
            dist/BashPrime Hint Tracker*.AppImage
